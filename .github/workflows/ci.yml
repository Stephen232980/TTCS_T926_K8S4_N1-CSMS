name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && 'csms-staging' || format('{0}-{1}-{2}', github.workflow, github.event_name, github.ref) }}
  cancel-in-progress: false

jobs:
  quality:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://csms:ci_password@localhost:5432/csms

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: csms
          POSTGRES_USER: csms
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U csms -d csms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run mypy
        run: mypy src

      - name: Validate staging deployment script
        run: bash -n scripts/deploy_staging.sh scripts/deploy_frontend_staging.sh

      - name: Apply database migrations
        run: alembic upgrade head

      # Keep the latency gate mandatory, but isolate its Python process and
      # run it before the functional suite changes caches/DB workload.
      - name: Run MeterValues latency check
        run: >-
          pytest
          tests/test_charging_sessions.py::test_committed_replay_and_twenty_concurrent_meter_replies_under_200ms
          -q -s

      - name: Run functional tests
        run: >-
          pytest
          --deselect=tests/test_charging_sessions.py::test_committed_replay_and_twenty_concurrent_meter_replies_under_200ms

  frontend-quality:
    name: Frontend lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  # S-26: run the same pinned 20-charger recovery fleet that developers run by Compose.
  simulator-scenario:
    name: Verify 20 OCPP virtual chargers
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 5
    env:
      POSTGRES_DB: csms_s26
      POSTGRES_USER: csms
      POSTGRES_PASSWORD: ci_simulator_only
      SIMULATOR_OPERATOR_PASSWORD: ci_simulator_only
      SIMULATOR_COUNT: 20
      SIMULATOR_CODE_PREFIX: SIM-CI-
      SIMULATOR_TAG_PREFIX: SIMTAG-CI-
      SIMULATOR_RANDOM_SEED: 2600
      SIMULATOR_MAX_RECONNECTS: 3
      SIMULATOR_HOLD_SECONDS: 45
      SIMULATOR_HEARTBEAT_SECONDS: 2
      SIMULATOR_VERIFY_TIMEOUT_SECONDS: 180

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Run S-26 Docker Compose scenario
        run: |
          set -euo pipefail
          mkdir -p .local/simulator-reports
          chmod 777 .local/simulator-reports
          docker compose --profile simulator up --build -d

          deadline=$((SECONDS + 240))
          verifier_id=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            verifier_id="$(docker compose --profile simulator ps -aq simulator-verify)"
            if [ -n "$verifier_id" ]; then
              state="$(docker inspect --format '{{.State.Status}}' "$verifier_id")"
              if [ "$state" = "exited" ]; then
                exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$verifier_id")"
                if [ "$exit_code" -eq 0 ]; then
                  exit 0
                fi
                exit "$exit_code"
              fi
            fi
            sleep 1
          done

          echo "S-26 verifier did not stop before the scenario deadline."
          exit 1

      - name: Collect S-26 logs and report
        if: always()
        run: |
          mkdir -p artifacts/s26
          docker compose --profile simulator logs --no-color > artifacts/s26/docker-compose.log || true
          docker compose --profile simulator ps -a > artifacts/s26/docker-compose-ps.txt || true
          cp .local/simulator-reports/simulator-results.json artifacts/s26/ 2>/dev/null || true
          docker compose --profile simulator down --remove-orphans

      - name: Upload S-26 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s26-simulator-evidence
          path: artifacts/s26
          if-no-files-found: warn

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [quality, simulator-scenario]
    # This check is already required by main's rulesets. A failed dependency
    # must produce a failed check, because GitHub accepts skipped required jobs.
    if: always()
    permissions:
      contents: read
      packages: write

    steps:
      - name: Require quality and S-26 scenario success
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SIMULATOR_RESULT: ${{ needs.simulator-scenario.result }}
        run: |
          if [ "$QUALITY_RESULT" != "success" ] || [ "$SIMULATOR_RESULT" != "success" ]; then
            echo "Required quality or S-26 scenario check did not succeed."
            exit 1
          fi

      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build --tag csms:test .
          docker tag csms:test "ghcr.io/${IMAGE_LOWER}:${{ github.sha }}"
          docker tag csms:test "ghcr.io/${IMAGE_LOWER}:latest"

      - name: Push image to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/${IMAGE_LOWER}:${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker push "ghcr.io/${IMAGE_LOWER}:latest"
          fi

  frontend-build:
    name: Build frontend Docker image
    runs-on: ubuntu-latest
    needs: [frontend-quality]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Build frontend Docker image
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build --tag csms-frontend:test ./frontend
          docker tag csms-frontend:test "ghcr.io/${IMAGE_LOWER}-frontend:${{ github.sha }}"
          docker tag csms-frontend:test "ghcr.io/${IMAGE_LOWER}-frontend:latest"

      - name: Push frontend image to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/${IMAGE_LOWER}-frontend:${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker push "ghcr.io/${IMAGE_LOWER}-frontend:latest"
          fi

  deploy:
    name: Deploy to Staging
    needs: [quality, build, simulator-scenario]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USER: ${{ github.actor }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Validate Staging Secrets
        run: |
          if [ -z "$STAGING_HOST" ] || [ -z "$STAGING_USER" ] || [ -z "$STAGING_SSH_KEY" ]; then
            echo "=========================================================================="
            echo "[ERROR] TRIỂN KHAI THẤT BẠI: Thiếu Staging Secrets trong Repository!"
            echo "Để triển khai tự động tới máy chủ Staging, bạn cần thêm 3 Secrets:"
            echo "  - STAGING_HOST: IP/tên miền máy chủ Staging"
            echo "  - STAGING_USER: Tài khoản SSH (vd: ubuntu hoặc deploy)"
            echo "  - STAGING_SSH_KEY: SSH Private Key"
            echo "=========================================================================="
            exit 1
          fi

      - name: Make deploy script executable
        run: chmod +x ./scripts/deploy_staging.sh

      - name: Deploy to Staging Server via SSH
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${IMAGE_LOWER}:${{ github.sha }}"
          SSH_PORT="${STAGING_PORT:-22}"

          mkdir -p ~/.ssh
          echo "$STAGING_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Đăng nhập GHCR và thực thi script deploy với cơ chế Candidate & Backup Rollback
          scp -P "$SSH_PORT" ./scripts/deploy_staging.sh "$STAGING_USER@$STAGING_HOST":/tmp/deploy_staging.sh
          ssh -p "$SSH_PORT" "$STAGING_USER@$STAGING_HOST" \
            "chmod +x /tmp/deploy_staging.sh && GHCR_TOKEN='${GHCR_TOKEN}' GHCR_USER='${GHCR_USER}' /tmp/deploy_staging.sh '$IMAGE_TAG'"

  frontend-deploy:
    name: Deploy frontend to Staging
    needs: [frontend-quality, frontend-build, deploy]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USER: ${{ github.actor }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Validate staging secrets
        run: |
          if [ -z "$STAGING_HOST" ] || [ -z "$STAGING_USER" ] || [ -z "$STAGING_SSH_KEY" ]; then
            echo "[ERROR] Missing STAGING_HOST, STAGING_USER, or STAGING_SSH_KEY."
            exit 1
          fi

      - name: Deploy frontend to staging server via SSH
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${IMAGE_LOWER}-frontend:${{ github.sha }}"
          SSH_PORT="${STAGING_PORT:-22}"

          mkdir -p ~/.ssh
          echo "$STAGING_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          scp -P "$SSH_PORT" ./scripts/deploy_frontend_staging.sh "$STAGING_USER@$STAGING_HOST":/tmp/deploy_frontend_staging.sh
          ssh -p "$SSH_PORT" "$STAGING_USER@$STAGING_HOST" \
            "chmod +x /tmp/deploy_frontend_staging.sh && GHCR_TOKEN='${GHCR_TOKEN}' GHCR_USER='${GHCR_USER}' /tmp/deploy_frontend_staging.sh '$IMAGE_TAG'"
