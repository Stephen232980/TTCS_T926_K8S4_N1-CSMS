name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://csms:ci_password@localhost:5432/csms

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: csms
          POSTGRES_USER: csms
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U csms -d csms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run mypy
        run: mypy src

      - name: Validate staging deployment script
        run: bash -n scripts/deploy_staging.sh scripts/deploy_frontend_staging.sh

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest

  frontend-quality:
    name: Frontend lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build --tag csms:test .
          docker tag csms:test "ghcr.io/${IMAGE_LOWER}:${{ github.sha }}"
          docker tag csms:test "ghcr.io/${IMAGE_LOWER}:latest"

      - name: Push image to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/${IMAGE_LOWER}:${{ github.sha }}"
          docker push "ghcr.io/${IMAGE_LOWER}:latest"

  frontend-build:
    name: Build frontend Docker image
    runs-on: ubuntu-latest
    needs: [frontend-quality]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Build frontend Docker image
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build --tag csms-frontend:test ./frontend
          docker tag csms-frontend:test "ghcr.io/${IMAGE_LOWER}-frontend:${{ github.sha }}"
          docker tag csms-frontend:test "ghcr.io/${IMAGE_LOWER}-frontend:latest"

      - name: Push frontend image to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/${IMAGE_LOWER}-frontend:${{ github.sha }}"
          docker push "ghcr.io/${IMAGE_LOWER}-frontend:latest"

  deploy:
    name: Deploy to Staging
    needs: [quality, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USER: ${{ github.actor }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Validate Staging Secrets
        run: |
          if [ -z "$STAGING_HOST" ] || [ -z "$STAGING_USER" ] || [ -z "$STAGING_SSH_KEY" ]; then
            echo "=========================================================================="
            echo "[ERROR] TRIỂN KHAI THẤT BẠI: Thiếu Staging Secrets trong Repository!"
            echo "Để triển khai tự động tới máy chủ Staging, bạn cần thêm 3 Secrets:"
            echo "  - STAGING_HOST: IP/tên miền máy chủ Staging"
            echo "  - STAGING_USER: Tài khoản SSH (vd: ubuntu hoặc deploy)"
            echo "  - STAGING_SSH_KEY: SSH Private Key"
            echo "=========================================================================="
            exit 1
          fi

      - name: Make deploy script executable
        run: chmod +x ./scripts/deploy_staging.sh

      - name: Deploy to Staging Server via SSH
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${IMAGE_LOWER}:${{ github.sha }}"
          SSH_PORT="${STAGING_PORT:-22}"

          mkdir -p ~/.ssh
          echo "$STAGING_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Đăng nhập GHCR và thực thi script deploy với cơ chế Candidate & Backup Rollback
          scp -P "$SSH_PORT" ./scripts/deploy_staging.sh "$STAGING_USER@$STAGING_HOST":/tmp/deploy_staging.sh
          ssh -p "$SSH_PORT" "$STAGING_USER@$STAGING_HOST" \
            "chmod +x /tmp/deploy_staging.sh && GHCR_TOKEN='${GHCR_TOKEN}' GHCR_USER='${GHCR_USER}' /tmp/deploy_staging.sh '$IMAGE_TAG'"

  frontend-deploy:
    name: Deploy frontend to Staging
    needs: [frontend-quality, frontend-build, deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USER: ${{ github.actor }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Validate staging secrets
        run: |
          if [ -z "$STAGING_HOST" ] || [ -z "$STAGING_USER" ] || [ -z "$STAGING_SSH_KEY" ]; then
            echo "[ERROR] Missing STAGING_HOST, STAGING_USER, or STAGING_SSH_KEY."
            exit 1
          fi

      - name: Deploy frontend to staging server via SSH
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${IMAGE_LOWER}-frontend:${{ github.sha }}"
          SSH_PORT="${STAGING_PORT:-22}"

          mkdir -p ~/.ssh
          echo "$STAGING_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          scp -P "$SSH_PORT" ./scripts/deploy_frontend_staging.sh "$STAGING_USER@$STAGING_HOST":/tmp/deploy_frontend_staging.sh
          ssh -p "$SSH_PORT" "$STAGING_USER@$STAGING_HOST" \
            "chmod +x /tmp/deploy_frontend_staging.sh && GHCR_TOKEN='${GHCR_TOKEN}' GHCR_USER='${GHCR_USER}' /tmp/deploy_frontend_staging.sh '$IMAGE_TAG'"
