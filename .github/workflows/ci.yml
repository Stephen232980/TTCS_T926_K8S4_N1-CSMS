name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://csms:ci_password@localhost:5432/csms

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: csms
          POSTGRES_USER: csms
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U csms -d csms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run mypy
        run: mypy src

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest
        
  build:
    name: Build & Push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build --tag csms:test .
          docker tag csms:test "ghcr.io/${IMAGE_LOWER}:${{ github.sha }}"
          docker tag csms:test "ghcr.io/${IMAGE_LOWER}:latest"

      - name: Push image to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/${IMAGE_LOWER}:${{ github.sha }}"
          docker push "ghcr.io/${IMAGE_LOWER}:latest"

  deploy:
    name: Deploy to Staging
    needs: [quality, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Make deploy script executable
        run: chmod +x ./scripts/deploy_staging.sh

      - name: Deploy to Staging Server via SSH
        if: "${{ secrets.STAGING_HOST != '' }}"
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_PORT: ${{ secrets.STAGING_PORT || '22' }}
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${IMAGE_LOWER}:${{ github.sha }}"
          mkdir -p ~/.ssh
          echo "$STAGING_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$STAGING_PORT" -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # Truyền script deploy lên máy chủ staging và thực thi kiểm tra sức khỏe + rollback
          scp -P "$STAGING_PORT" ./scripts/deploy_staging.sh "$STAGING_USER@$STAGING_HOST":/tmp/deploy_staging.sh
          ssh -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" "chmod +x /tmp/deploy_staging.sh && /tmp/deploy_staging.sh $IMAGE_TAG"

      - name: Deployment Readiness Notice
        if: "${{ secrets.STAGING_HOST == '' }}"
        run: |
          echo "=========================================================================="
          echo "[THÔNG BÁO] Docker image đã đóng gói và đẩy lên GitHub Container Registry:"
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "Tag: ghcr.io/${IMAGE_LOWER}:${{ github.sha }}"
          echo ""
          echo "[SẴN SÀNG TRIỂN KHAI] Script ./scripts/deploy_staging.sh đã sẵn sàng với cơ chế Candidate & Zero-Downtime Rollback."
          echo "Để triển khai tự động tới máy chủ riêng qua SSH, bạn chỉ cần thêm 3 Secrets vào GitHub Repository:"
          echo "  - STAGING_HOST: IP hoặc tên miền của máy chủ staging"
          echo "  - STAGING_USER: Tên tài khoản SSH trên máy chủ (vd: ubuntu hoặc deploy)"
          echo "  - STAGING_SSH_KEY: Khóa riêng tư SSH (Private Key) để truy cập máy chủ"
          echo "  - STAGING_PORT: (Tùy chọn) Cổng SSH nếu khác 22"
          echo "=========================================================================="