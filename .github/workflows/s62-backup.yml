name: S-62 backup restore acceptance
on:
  pull_request:
    paths:
      - scripts/backup_database.py
      - tests/test_database_backup.py
      - tests/test_s62_backup_postgres.py
      - ops/backup/**
      - .github/workflows/s62-backup.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:55478/s62_source
      S62_ACCEPTANCE_CONTAINER: csms-s62-review-db
      S62_ACCEPTANCE_TARGET_URL: postgresql+psycopg://postgres@127.0.0.1:55478/s62_restore
      LEGACY_SETTLEMENT_CUTOFF: '1970-01-01T00:00:00+00:00'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Provision disposable PostgreSQL 16
        run: |
          docker network create csms-s62-review
          docker run -d --name csms-s62-review-db --network csms-s62-review -p 127.0.0.1:55478:5432 -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=s62_source postgres:16
          for attempt in $(seq 1 30); do
            if docker exec csms-s62-review-db pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker exec csms-s62-review-db createdb -U postgres s62_restore
          alembic upgrade head
      - name: Build actual backup runtime and verify scheduler files
        run: |
          docker build -f ops/backup/Dockerfile -t csms-s62-backup:review .
          sh -n ops/backup/run-backup.sh
          systemd-analyze calendar '*-*-* 02:00:00 Asia/Ho_Chi_Minh'
      - name: Unit and real database restore acceptance
        run: pytest tests/test_database_backup.py tests/test_s62_backup_postgres.py -q -s
      - name: Clean up disposable database
        if: always()
        run: |
          docker rm -f csms-s62-review-db || true
          docker network rm csms-s62-review || true
